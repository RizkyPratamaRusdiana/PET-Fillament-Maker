; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Supported hardware (same firmware, same GRBL pin mapping on both):
;   uno       -> Arduino UNO  + CNC Shield V3
;   nano      -> Arduino Nano + CNC Shield V4, OLD bootloader (most CH340 clones)
;   nano_new  -> Arduino Nano + CNC Shield V4, NEW Optiboot bootloader
;                (use this if `nano` upload fails with "stk500_getsync(): not in sync")
;
; Pick the board by changing default_envs below, or per command:
;   pio run -e nano -t upload
;   pio run -e thermistor_test_nano -t upload
; ---------------------------------------------------------------------------
[platformio]
default_envs = nano

; ---- Shared settings -------------------------------------------------------
[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600

[board_uno]
board = uno
upload_port = COM43
monitor_port = COM43

[board_nano]
board = nanoatmega328
build_flags = -DCNC_SHIELD_V4   ; X STEP/DIR swapped on this shield (STEP=D5, DIR=D2)
; upload/monitor port auto-detected (the CH340 COM number changes per USB socket)

[board_nano_new]
board = nanoatmega328new
build_flags = -DCNC_SHIELD_V4   ; X STEP/DIR swapped on this shield (STEP=D5, DIR=D2)
; upload/monitor port auto-detected (the CH340 COM number changes per USB socket)

[app]
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
; tft_text.cpp = ST7789 1.47" SPI display driver, kept for later but not
; used by the current LCD1602 firmware.
build_src_filter = +<*> -<thermistor_test.cpp> -<ssr_test.cpp> -<pin_probe.cpp> -<step_finder.cpp> -<tft_text.cpp>

; Minimal standalone thermistor ADC test - see src/thermistor_test.cpp.
[thermistor_test]
build_src_filter = +<thermistor_test.cpp> -<main.cpp> -<ssr_test.cpp> -<pin_probe.cpp> -<step_finder.cpp>

; Minimal standalone SSR/MOSFET heater on-off test - see src/ssr_test.cpp.
[ssr_test]
build_src_filter = +<ssr_test.cpp> -<main.cpp> -<thermistor_test.cpp> -<pin_probe.cpp> -<step_finder.cpp>

; ---- Main firmware ---------------------------------------------------------
[env:uno]
extends = board_uno, app

[env:nano]
extends = board_nano, app

[env:nano_new]
extends = board_nano_new, app

; ---- Hardware test sketches ------------------------------------------------
[env:thermistor_test_uno]
extends = board_uno, thermistor_test

[env:thermistor_test_nano]
extends = board_nano, thermistor_test

[env:thermistor_test_nano_new]
extends = board_nano_new, thermistor_test

[env:ssr_test_uno]
extends = board_uno, ssr_test

[env:ssr_test_nano]
extends = board_nano, ssr_test

[env:ssr_test_nano_new]
extends = board_nano_new, ssr_test

; Pin probe - prints every pin that changes level; used to find which Nano
; pin a shield header (Abort/Hold/Resume...) is really wired to.
[pin_probe]
build_src_filter = +<pin_probe.cpp> -<main.cpp> -<thermistor_test.cpp> -<ssr_test.cpp>

[env:pin_probe_nano]
extends = board_nano, pin_probe

; Step-pin finder - pulses candidate pins one by one to find which one the
; shield actually routes to the X driver's STEP input.
[step_finder]
build_src_filter = +<step_finder.cpp>

[env:step_finder_nano]
extends = board_nano, step_finder
