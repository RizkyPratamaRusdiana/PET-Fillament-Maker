; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    waspinator/AccelStepper @ ^1.64
    paulstoffregen/Encoder @ ^1.4.4
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_src_filter = +<*> -<thermistor_test.cpp> -<ssr_test.cpp>

upload_port = COM43

; Minimal standalone thermistor ADC test - see src/thermistor_test.cpp.
; Build/upload with: pio run -e thermistor_test -t upload
[env:thermistor_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<thermistor_test.cpp> -<main.cpp> -<ssr_test.cpp>
upload_port = COM43

; Minimal standalone SSR/MOSFET heater on-off test - see src/ssr_test.cpp.
; Build/upload with: pio run -e ssr_test -t upload
[env:ssr_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<ssr_test.cpp> -<main.cpp> -<thermistor_test.cpp>
upload_port = COM43
